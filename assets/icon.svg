<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="HubbleMind Visualization App: a query turned into bar, line and pie charts">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14a38b"/>
      <stop offset="1" stop-color="#0b3d3a"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  <!-- query prompt -->
  <path d="M22 24 L32 31 L22 38" fill="none" stroke="#ffffff" stroke-opacity=".55" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="38" y="35" width="18" height="4" rx="2" fill="#ffffff" fill-opacity=".55"/>
  <!-- pie -->
  <circle cx="92" cy="34" r="15" fill="#ffffff" fill-opacity=".25"/>
  <path d="M92 34 L92 19 A15 15 0 0 1 106.3 38.6 Z" fill="#ffd166"/>
  <!-- bars -->
  <g fill="#ffffff">
    <rect x="24" y="78" width="14" height="26" rx="3"/>
    <rect x="44" y="64" width="14" height="40" rx="3"/>
    <rect x="64" y="72" width="14" height="32" rx="3"/>
    <rect x="84" y="56" width="14" height="48" rx="3"/>
  </g>
  <!-- line over the bars -->
  <path d="M31 70 L51 56 L71 64 L91 46" fill="none" stroke="#ffd166" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#ffd166"><circle cx="31" cy="70" r="4"/><circle cx="51" cy="56" r="4"/><circle cx="71" cy="64" r="4"/><circle cx="91" cy="46" r="4"/></g>
  <rect x="18" y="106" width="92" height="4" rx="2" fill="#ffffff" fill-opacity=".7"/>
</svg>
